name: Verify studio
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Run browser acceptance
        run: |
          if browser_path=$(command -v google-chrome || command -v chromium); then
            CHROMIUM_EXECUTABLE="$browser_path" npm run test:e2e
          else
            npx playwright install --with-deps chromium
            npm run test:e2e
          fi
